AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Gold Forecast Agent — AWS Migration v3 (Lambda + EventBridge Scheduler + S3 state + S3 dashboard)

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        STATE_BUCKET_NAME: !Ref StateBucket

Resources:

  # ─── S3 Bucket for Pipeline State (replaces Upstash Redis) ─────────────────
  # Holds 6 small objects: gold_forecast_history.csv, last_forecast.json,
  # analysis_history.json, adaptive_state.json, gold_forecast_accuracy.csv,
  # gold_forecast_accuracy_legacy.csv. Versioning is on so a bad write is
  # recoverable.
  StateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "goldforecast-state-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ─── Lambda: Forecast Cron ─────────────────────────────────────────────────
  # Secrets (Groq, Alpha Vantage, Cron) are loaded from SSM at runtime.
  # State (CSV + JSON blobs) is read/written via S3.
  ForecastCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: goldforecast-forecast-cron
      CodeUri: dist/
      Handler: forecast-handler.handler
      Timeout: 270
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameters
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/gold-forecast/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/alias/aws/ssm"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt StateBucket.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${StateBucket.Arn}/*"

  ForecastCronLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/goldforecast-forecast-cron
      RetentionInDays: 30

  # ─── EventBridge Scheduler (DST-aware via TimeZone parameter) ──────────────
  ForecastSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-forecast-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ForecastCronFunction.Arn

  ForecastSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: goldforecast-daily-cron
      Description: Daily forecast at 10 AM Toronto time (DST-aware)
      ScheduleExpression: "cron(0 10 * * ? *)"
      ScheduleExpressionTimezone: "America/Toronto"
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ForecastCronFunction.Arn
        RoleArn: !GetAtt ForecastSchedulerRole.Arn

  # ─── Lambda: History API ───────────────────────────────────────────────────
  HistoryApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: goldforecast-history-api
      CodeUri: dist/
      Handler: history-handler.handler
      Timeout: 30
      MemorySize: 256
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt StateBucket.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${StateBucket.Arn}/*"
      Events:
        GetHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HistoryApi
            Method: GET
            Path: /api/history

  HistoryApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/goldforecast-history-api
      RetentionInDays: 30

  # ─── API Gateway HTTP API v2 ───────────────────────────────────────────────
  HistoryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "OPTIONS"]
        AllowHeaders: ["Content-Type"]

  # ─── S3 Bucket for Static Site (public website hosting) ────────────────────
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "goldforecast-dashboard-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"

Outputs:
  ForecastCronFunctionArn:
    Description: ARN of the forecast-cron Lambda function
    Value: !GetAtt ForecastCronFunction.Arn

  HistoryApiUrl:
    Description: API Gateway URL for /api/history
    Value: !Sub "https://${HistoryApi}.execute-api.${AWS::Region}.amazonaws.com/api/history"

  DashboardUrl:
    Description: S3 static website URL (HTTP — for dashboard)
    Value: !Sub "http://${DashboardBucket}.s3-website-${AWS::Region}.amazonaws.com"

  DashboardBucketName:
    Description: S3 bucket name for static site uploads
    Value: !Ref DashboardBucket

  StateBucketName:
    Description: S3 bucket name for pipeline state (replaces Upstash Redis)
    Value: !Ref StateBucket

  ForecastSchedulerRoleArn:
    Description: IAM role ARN for EventBridge Scheduler (used by test schedules)
    Value: !GetAtt ForecastSchedulerRole.Arn
